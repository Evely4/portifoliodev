   <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evely Silva | Eng. Computação | Front-End</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto+Mono:wght@300;400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-dark: #050509; --bg-card: rgba(10, 11, 20, 0.8); --primary: #00f2fe; --secondary: #4facfe; --accent: #ec4899; --text-main: #e2e8f0; --font-code: 'Roboto Mono', monospace; --font-body: 'Poppins', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; overflow-x: hidden; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-body); line-height: 1.6; overflow-x: hidden; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.4; }
        .ambient-glow { position: fixed; width: 80vw; height: 80vw; border-radius: 50%; background: radial-gradient(circle, rgba(79, 172, 254, 0.1) 0%, rgba(0, 0, 0, 0) 70%); z-index: -1; filter: blur(80px); pointer-events: none; }
        .glow-1 { top: -20%; left: -20%; }
        .glow-2 { bottom: -20%; right: -20%; background: radial-gradient(circle, rgba(236, 72, 153, 0.05) 0%, rgba(0, 0, 0, 0) 70%); }
        #back-to-top { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; background: rgba(10, 11, 20, 0.6); border: 1px solid var(--primary); color: var(--primary); border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.4s ease; backdrop-filter: blur(10px); }
        #back-to-top.visible { opacity: 1; visibility: visible; }
        .terminal-window { background: rgba(0, 0, 0, 0.8); border: 1px solid #333; border-radius: 8px; width: 100%; max-width: 800px; font-family: var(--font-code); box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .terminal-header { background: #1a1a1a; padding: 10px; border-bottom: 1px solid #333; display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }
        .terminal-body { padding: 20px; color: #a6accd; font-size: 14px; }
        .cmd { color: var(--primary); } .str { color: var(--accent); } .comment { color: #676e95; }
        h1.name { font-size: clamp(2rem, 6vw, 3.5rem); color: #fff; margin: 10px 0; text-shadow: 0 0 15px var(--primary); }
        .typing-cursor { display: inline-block; width: 8px; height: 1.2em; background: var(--primary); margin-left: 4px; animation: blink 1s infinite; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .project-card { background: var(--bg-card); border-radius: 12px; border: 1px solid #222; padding: 25px; transition: 0.4s; }
        .project-card:hover { border-color: var(--secondary); box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .btn { display: inline-block; padding: 12px 24px; border-radius: 6px; font-family: var(--font-code); font-size: 13px; font-weight: 600; text-transform: uppercase; border: 1px solid var(--primary); color: var(--primary); cursor: pointer; text-decoration: none; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <button id="back-to-top" onclick="window.scrollTo(0,0)">▲</button>
    <canvas id="particle-canvas"></canvas>
    <header class="min-h-screen flex flex-col justify-center items-center p-5">
        <div class="terminal-window">
            <div class="terminal-header"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
            <div class="terminal-body">
                <div><span class="cmd">evely@univesp:~$</span> nano profile.json</div>
                <br><div>{</div>
                <div style="padding-left: 20px;">"<span class="str">status</span>": "<span id="typing-status"></span><span class="typing-cursor"></span>",</div>
                <div>}</div>
                <h1 class="name">Evely Silva</h1>
                <div class="comment">// Engenharia da Computação</div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-5">
        <section id="projects" class="mb-20">
            <h2 class="text-3xl text-primary font-bold mb-10">Projetos</h2>
            <div class="projects-grid">
                <div class="project-card border-l-4 border-cyan-400">
                    <h3 class="text-xl font-bold mb-4">Sistema de Monitoramento e Agentes IA</h3>
                    <p class="mb-6 text-sm text-gray-300">Convergência entre Engenharia, Python e Automação Inteligente (RPA). Sistema de multi-agentes para monitoramento computacional.</p>
                    <a href="https://github.com/Evely4/-Projeto-Agentes-IA/blob/main/README.md" target="_blank" class="btn">Ver Repositório</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Typing effect
        const statusText = "Em busca da primeira oportunidade em Tech";
        let charIndex = 0;
        function typeStatus() {
            if (charIndex < statusText.length) {
                document.getElementById("typing-status").innerHTML += statusText.charAt(charIndex);
                charIndex++;
                setTimeout(typeStatus, 55);
            }
        }
        window.onload = typeStatus;

        // Scroll fix
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('back-to-top');
            if (window.scrollY > 400) btn.classList.add('visible');
            else btn.classList.remove('visible'); // Corrigido aqui
        });

        // Partículas (Simplificado para performance)
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();
    </script>
</body>
</html>
